      ctx.fillStyle = "#9fe8ff"; ctx.fillRect(x0, 34, (x1 - x0) * k, 3);
    }
    bossHud(t);
    if (curLevel) return levelHud(t);
    const gs = ghost.scores[Math.min(t, ghost.scores.length - 1)], lead = me.score - gs;
    ctx.textAlign = "right"; ctx.font = "600 11px 'Chakra Petch', sans-serif";
    ctx.fillStyle = t >= ghost.t || lead >= 0 ? "#4fe0cf" : "#ff7a3d";
    const gl = ghost.name ? ghost.name.toUpperCase() : `GHOST ${world.partner[0]}`;
    ctx.fillText(t >= ghost.t ? `${gl} OUT` : `${gl} ${lead >= 0 ? "+" : "−"}${Math.abs(lead).toLocaleString()}`, W - 14, 46);
    if (pbLive) {
      const pd = me.score - pbLive.scores[Math.min(t, pbLive.scores.length - 1)];
      ctx.textAlign = "left"; ctx.fillStyle = pd >= 0 ? "#4fe0cf" : PB_COL;
      ctx.fillText(`BEST ${pd >= 0 ? "+" : "−"}${Math.abs(pd).toLocaleString()}`, me.mult < 5 ? 62 : 14, 46);
    }
  }

  // ---------- loop ----------
  function frame(now) {
    const dt = Math.min(100, now - last); last = now;
    if (state === "countdown" && now >= resumeAt) { state = "play"; acc = 0; }
    const frozen = hitStopMs > 0;
    if (frozen) hitStopMs -= dt;
    if (state === "play") {
      if (frozen) acc = 0;
      else {
        /* close-call slow motion eases from 35% speed back to full */
        const scale = slowMs > 0 ? 1 - 0.65 * Math.min(1, slowMs / SLOW_LEN * 1.6) : 1;
        acc += dt * scale;
        const stepMs = 1000 / TPS;
        while (acc >= stepMs && state === "play" && hitStopMs <= 0) { tick(); acc -= stepMs; }
        if (hitStopMs > 0) acc = 0;
      }
      if (slowMs > 0) slowMs = Math.max(0, slowMs - dt);
      if (slowCool > 0) slowCool -= dt;
    } else slowMs = 0;
    if (me) comboGlow += ((me.alive && me.mult > 1 ? (me.mult - 1) / 4 : 0) - comboGlow) * 0.12;
    if (nearRing && ++nearRing.t > 22) nearRing = null;
    if (!frozen) stepChunks();
    for (const p of particles) { p.x += p.vx; p.y += p.vy; p.vx *= .96; p.vy = p.vy * .96 + (p.g || 0); p.life--; }
    particles = particles.filter(p => p.life > 0);
    { const cap = lowGfx() ? 140 : 700; if (particles.length > cap) particles.splice(0, particles.length - cap); }
    for (const f of floaters) f.t++;
    floaters = floaters.filter(f => f.t < 45);
    for (const g of rings) g.r += g.v || 7;
    boomStep(GAME_FX);
    rings = rings.filter(g => g.r < g.max);
    shake *= .85; if (shake < .5) shake = 0;
    if (bossFlash > 0) bossFlash--;
    if (escFlash > 0) escFlash--;
    if (spotFx > 0) spotFx--;
    if (flash) { flash.a *= .88; if (flash.a < .02) flash = null; }
    {
      const run = me && (state === "play" || state === "countdown" || state === "dying");
      MUSIC.want.on = !save.musicOff;
      /* v36 (fun plan 3): the run's music keeps playing on the results screen, so Retry jumps straight back into the beat */
      MUSIC.want.style = run || (me && state === "over") ? (curLevel ? curLevel.w : theme ? theme.world : 0) : "menu";
      MUSIC.want.fever = !!(run && me.alive && me.fever > 0);
      MUSIC.want.boost = run ? Math.min(4, (sector || 1) - 1) : 0;
      MUSIC.want.boss = !!(run && me.alive && bossNow(me.t));
      MUSIC.want.dim = run && (slowMs > 0 || hitStopMs > 0);
      MUSIC.want.paused = state === "paused";
    }
    radioUpdate(dt);
    draw();
    if (shopTab === "booms" && !$("#shop").hidden) drawBoomPreview();
    if (previewTheme && !$("#levels").hidden) { const pv = $("#lv-prev"); if (pv) drawPreview(pv, previewTheme); }
    requestAnimationFrame(frame);
  }

  /* v30 (QA 3): if the start screen still can't draw from this save, offer a reset instead of a blank screen */
  function rescue(err) {
    const o = $("#start"); let armed = false;
    o.innerHTML = `<h2>Meteor <span class="hl">Pilot</span></h2>
      <div class="quick">Your saved game couldn't be loaded on this device.</div>
      <button class="btn" id="rescue">Reset game data</button>
      <p class="fine">This erases coins, levels and unlocks on this device so the game can start fresh.</p>`;
    o.hidden = false;
    $("#rescue").onclick = () => {
      if (!armed) { armed = true; $("#rescue").textContent = "Tap again to erase"; return; }
      try { localStorage.removeItem("cometrun:v2"); } catch (e) {}
      location.reload();
    };
    try { console.warn("Meteor Pilot: start failed", err); } catch (e) {}
  }
  try { setup(true); paintChips(); showStart(); openChallengeFromHash(); } catch (err) { rescue(err); }
  fit(); resize();
  requestAnimationFrame(t => { last = t; frame(t); });
})();
</script>
<!-- GAME:END -->

<script>
/* App shell: offline support and the install button. Separate from the game code. */
(function () {
  if ("serviceWorker" in navigator && location.protocol !== "file:") {
    addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(() => {}); });
  }
  let deferred = null;
  const btn = document.createElement("button");
  btn.className = "chip install"; btn.id = "install"; btn.hidden = true; btn.textContent = "Install";
  const chips = document.querySelector(".chips"); if (chips) chips.insertBefore(btn, chips.firstChild);
  addEventListener("beforeinstallprompt", e => { e.preventDefault(); deferred = e; btn.hidden = false; });
  btn.addEventListener("click", async () => {
    if (!deferred) return;
    deferred.prompt();
    try { await deferred.userChoice; } catch (e) {}
    deferred = null; btn.hidden = true;
  });
  addEventListener("appinstalled", () => { btn.hidden = true; });
  // keep the screen awake while playing, where allowed
  let lock = null;
  async function wake() { try { if ("wakeLock" in navigator && document.visibilityState === "visible") lock = await navigator.wakeLock.request("screen"); } catch (e) {} }
  document.addEventListener("visibilitychange", wake); addEventListener("pointerdown", wake, { once: true });
})();
</script>
