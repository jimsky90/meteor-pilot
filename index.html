<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Meteor Pilot</title>
<meta name="description" content="A one-thumb space arcade game: pilot a 3D fighter through meteors, chain star combos, beat bosses across 40 levels.">
<meta name="theme-color" content="#070a1a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Meteor Pilot">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
:root { box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; }
img { max-width: 100%; }
html, body { -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; }
.chip.install { font: inherit; cursor: pointer; color: #070a1a; background: #4fe0cf; border-color: #4fe0cf; font-weight: 700; }
</style>
</head>
<body>
<!-- GAME:START -->
<style>
/* Layout: one portrait arcade screen, centered; HUD drawn on canvas, menus as overlays on the screen. Single deliberate deep-space theme. */
:root {
  --space: #070a1a;
  --panel: rgba(12, 17, 42, .92);
  --ink: #eef0ff;
  --muted: #8d93bf;
  --rule: #273061;
  --gold: #ffcc4d;
  --ember: #ff7a3d;
  --tide: #4fe0cf;
  --hurt: #ff4f62;
  --f-display: "Chakra Petch", "Arial Narrow", system-ui, sans-serif;
  --f-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; background: var(--space); color: var(--ink); }
body {
  font-family: var(--f-body); font-size: 16px; line-height: 1.4;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 10px 12px;
  box-sizing: border-box; display: flex; flex-direction: column; align-items: center; gap: 8px;
  overflow: hidden; overscroll-behavior: none;
}
.top { width: 100%; max-width: 420px; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
h1 { font-family: var(--f-display); font-weight: 700; font-size: 1.3rem; letter-spacing: .04em; margin: 0; text-transform: uppercase; white-space: nowrap; }
h1 span { color: var(--ember); }
.chips { display: flex; gap: 6px; align-items: center; font-family: var(--f-display); font-size: .82rem; font-variant-numeric: tabular-nums; }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 3px 9px; border-radius: 99px; border: 1px solid var(--rule); background: rgba(12,17,42,.7); white-space: nowrap; }
.chip.coin b { color: var(--gold); }
.chip.fire b { color: var(--ember); }
/* v26: the top bar never pushes the page sideways on small phones; with an extra chip (Install) it wraps instead */
.top > h1 { flex: none; }
.chips { min-width: 0; flex-wrap: wrap; justify-content: flex-end; row-gap: 4px; }
@media (max-width: 400px) { h1 { font-size: 1.05rem; letter-spacing: .02em; } .chips { gap: 4px; } .chip { padding: 3px 7px; } .top { gap: 6px; } }
@media (max-width: 380px) { h1 { font-size: .95rem; letter-spacing: 0; } .chips { font-size: .74rem; gap: 3px; } .chip { padding: 3px 6px; gap: 3px; } }
@media (max-width: 340px) { h1 { font-size: .85rem; } .chip { padding: 2px 5px; } }
.mute { font: inherit; color: var(--ink); cursor: pointer; }
.mute.off { color: var(--muted); text-decoration: line-through; opacity: .6; }
.stage { position: relative; flex: none; max-width: 100%; border-radius: 18px; overflow: hidden; border: 1px solid var(--rule);
  touch-action: none; user-select: none; -webkit-user-select: none; }
canvas { display: block; width: 100%; height: 100%; }
.overlay {
  position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: safe center; align-items: center;
  gap: 12px; padding: 18px 16px; text-align: center; overflow-y: auto;
  background: radial-gradient(circle at 50% 40%, rgba(12,17,42,.8), rgba(7,10,26,.95));
}
.overlay h2 { font-family: var(--f-display); font-weight: 700; font-size: 2.3rem; line-height: 1; margin: 0; text-transform: uppercase; letter-spacing: .03em; }
.overlay h2 .hl { color: var(--ember); }
.eyebrow { font-family: var(--f-display); font-size: .72rem; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.eyebrow.hot { color: var(--gold); }
.quick { font-size: .85rem; color: var(--muted); max-width: 32ch; }
.quick b { color: var(--ink); font-weight: 700; }
.panel { width: 100%; max-width: 300px; display: grid; gap: 6px; text-align: left; }
.panel-h { font-family: var(--f-display); font-size: .72rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); display: flex; justify-content: space-between; }
.mission { display: grid; grid-template-columns: 1.3rem minmax(0,1fr) auto; gap: 8px; align-items: center; font-size: .86rem; padding: 6px 8px; border-radius: 10px; background: rgba(39,48,97,.35); }
.mission .ck { width: 1.1rem; height: 1.1rem; border-radius: 50%; border: 1.5px solid var(--muted); display: grid; place-items: center; font-size: .7rem; }
.mission.done .ck { background: var(--tide); border-color: var(--tide); color: var(--space); font-weight: 700; }
.mission.done span { color: var(--muted); text-decoration: line-through; }
.mission .rw { font-family: var(--f-display); color: var(--gold); font-size: .8rem; }
.skins { display: grid; grid-template-columns: repeat(5, minmax(0,1fr)); gap: 6px; }
.skin { display: grid; justify-items: center; gap: 2px; padding: 8px 2px 6px; border-radius: 10px; border: 1px solid var(--rule); background: rgba(12,17,42,.7); color: var(--ink); cursor: pointer; font: inherit; }
.skin .ship { width: 0; height: 0; border-left: 10px solid transparent; border-right: 10px solid transparent; border-bottom: 20px solid var(--c); filter: drop-shadow(0 0 6px var(--c)); }
.skin small { font-family: var(--f-display); font-size: .66rem; letter-spacing: .04em; white-space: nowrap; }
.skin.locked .ship { opacity: .3; }
.skin.locked small { color: var(--gold); }
.skin.sel { border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold) inset; }
.skin:focus-visible, .btn:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.big { font-family: var(--f-display); font-weight: 700; font-size: 3.4rem; line-height: 1; font-variant-numeric: tabular-nums; color: var(--gold); }
.verdict { font-family: var(--f-display); font-weight: 700; font-size: 1.05rem; }
.verdict.win { color: var(--tide); } .verdict.lose { color: var(--ember); }
.stats { display: grid; grid-template-columns: repeat(4, auto); gap: 4px 16px; justify-content: center; font-variant-numeric: tabular-nums; }
.stats div { display: grid; } .stats b { font-family: var(--f-display); font-size: 1.15rem; } .stats span { font-size: .7rem; color: var(--muted); }
.earn { font-family: var(--f-display); color: var(--gold); font-weight: 700; }
.bar { height: 6px; border-radius: 99px; background: rgba(39,48,97,.8); overflow: hidden; }
.bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--ember), var(--gold)); border-radius: 99px; }
.next { font-size: .8rem; color: var(--muted); }
pre.share { position: absolute; left: -9999px; }
.btns { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.btn { font-family: var(--f-display); font-weight: 700; font-size: 1.1rem; letter-spacing: .06em; text-transform: uppercase;
  border: 0; border-radius: 12px; padding: 13px 34px; background: var(--gold); color: var(--space); cursor: pointer; }
.btn.alt { background: transparent; color: var(--ink); border: 1px solid var(--rule); font-size: .82rem; padding: 9px 13px; }
.btn:active { transform: translateY(1px); }
.btn.pulse { animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 50% { box-shadow: 0 0 0 8px rgba(255,204,77,0); transform: scale(1.03); } 0%, 100% { box-shadow: 0 0 0 0 rgba(255,204,77,.5); } }
.pausebtn { position: absolute; top: 9px; left: 50%; transform: translateX(-50%); width: 34px; height: 34px; border-radius: 10px; border: 1px solid var(--rule); background: rgba(7,10,26,.7); color: var(--ink); font-family: var(--f-display); font-weight: 700; font-size: .8rem; letter-spacing: -.1em; cursor: pointer; }
.pausebtn:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

/* levels + pilot rank */
.duo { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
.btn.lvl { background: var(--tide); }
.rank { width: 100%; max-width: 300px; display: grid; grid-template-columns: auto minmax(0,1fr); gap: 4px 10px; align-items: center; text-align: left; }
.rank .badge { grid-row: span 2; width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; font-family: var(--f-display); font-weight: 700; font-size: 1.15rem; background: linear-gradient(135deg, var(--gold), var(--ember)); color: var(--space); }
.rank .rt { font-family: var(--f-display); font-size: .8rem; letter-spacing: .06em; text-transform: uppercase; display: flex; justify-content: space-between; gap: 8px; }
.rank .rt span { color: var(--muted); font-variant-numeric: tabular-nums; }
.bar.xp i { background: linear-gradient(90deg, var(--tide), #8ca0ff); transition: width .9s ease-out; }
.levels { justify-content: flex-start; align-items: stretch; text-align: left; gap: 10px; }
.wtabs { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 4px; }
.wtab { font: inherit; font-family: var(--f-display); font-size: .66rem; letter-spacing: .04em; text-transform: uppercase; padding: 7px 2px; border-radius: 9px; border: 1px solid var(--rule); background: rgba(12,17,42,.7); color: var(--muted); cursor: pointer; line-height: 1.2; }
.wtab.on { border-color: var(--wc); color: var(--ink); box-shadow: 0 0 0 1px var(--wc) inset; }
.wtab small { display: block; font-size: .6rem; color: var(--muted); text-transform: none; letter-spacing: 0; }
.whead { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.whead h3 { margin: 0; font-family: var(--f-display); font-size: 1.15rem; color: var(--wc); }
.whead span { font-size: .78rem; color: var(--muted); }
.lgrid { display: grid; grid-template-columns: repeat(5, minmax(0,1fr)); gap: 7px; }
.lt { aspect-ratio: 1; max-width: 100%; border-radius: 12px; border: 1px solid var(--rule); background: rgba(12,17,42,.8); color: var(--ink); font: inherit; cursor: pointer; display: grid; place-items: center; align-content: center; gap: 2px; padding: 0; }
.lt b { font-family: var(--f-display); font-size: 1.15rem; line-height: 1; }
.lt .ls { font-size: .62rem; letter-spacing: 1px; color: rgba(141,147,191,.45); }
.lt .ls i { font-style: normal; color: var(--gold); }
.lt.next { border-color: var(--wc); box-shadow: 0 0 12px -2px var(--wc); }
.lt.boss { background: rgba(39,48,97,.55); }
.lt:disabled { opacity: .35; cursor: default; }
.lt:focus-visible, .wtab:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.brief { border: 1px solid var(--wc); border-radius: 14px; padding: 12px; display: grid; gap: 8px; background: rgba(12,17,42,.85); }
.brief h3 { margin: 0; font-family: var(--f-display); font-size: 1.2rem; }
.brief .goal { font-size: 1rem; font-weight: 700; }
.crit { display: grid; gap: 4px; font-size: .84rem; }
.crit div { display: flex; gap: 8px; align-items: center; }
.crit .s { color: var(--gold); width: 1.1rem; text-align: center; }
.crit .s.off { color: rgba(141,147,191,.4); }
.crit .x { color: var(--hurt); width: 1.1rem; text-align: center; }
.bigstars { display: flex; gap: 10px; justify-content: center; font-size: 2.6rem; line-height: 1; }
.bigstars span { color: rgba(141,147,191,.3); }
.bigstars span.on { color: var(--gold); text-shadow: 0 0 18px rgba(255,204,77,.7); animation: starpop .45s cubic-bezier(.2,1.6,.4,1) both; }
.bigstars span.on:nth-child(2) { animation-delay: .25s; } .bigstars span.on:nth-child(3) { animation-delay: .5s; }
@keyframes starpop { from { transform: scale(.2) rotate(-40deg); opacity: 0; } }
.lvup { font-family: var(--f-display); font-weight: 700; color: var(--tide); letter-spacing: .04em; }

.lt { position: relative; overflow: hidden; }
.lt .nm { position: absolute; inset: auto 0 0 0; font-size: .5rem; letter-spacing: .02em; color: rgba(238,240,255,.75); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 3px 3px; }
.prev { width: 100%; max-width: 100%; aspect-ratio: 12 / 5; border-radius: 10px; display: block; border: 1px solid var(--rule); }
.tname { font-family: var(--f-display); font-size: .78rem; letter-spacing: .1em; text-transform: uppercase; color: var(--wc); }
.news { width: 100%; max-width: 300px; text-align: left; border: 1px solid var(--rule); border-radius: 12px; background: rgba(12,17,42,.7); }
.news summary { cursor: pointer; padding: 8px 12px; font-family: var(--f-display); font-size: .72rem; letter-spacing: .12em; text-transform: uppercase; color: var(--tide); }
.news ul { margin: 0; padding: 0 12px 10px 28px; display: grid; gap: 3px; font-size: .82rem; }
.toast { position: absolute; left: 50%; top: 13%; transform: translateX(-50%); font-family: var(--f-display); font-weight: 700; font-size: .95rem; letter-spacing: .04em;
  background: rgba(7,10,26,.85); border: 1px solid var(--tide); color: var(--tide); padding: 7px 14px; border-radius: 99px; white-space: nowrap; pointer-events: none; animation: drop .3s ease-out; }
.toast.gold { border-color: var(--gold); color: var(--gold); }
@keyframes drop { from { transform: translate(-50%, -10px); opacity: 0; } }

/* hangar */
.hangar { justify-content: flex-start; align-items: stretch; text-align: left; gap: 10px; }
.h-top { display: flex; justify-content: space-between; align-items: center; }
.h-top h2 { font-size: 1.7rem !important; }
.tabs { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 4px; background: rgba(39,48,97,.35); padding: 4px; border-radius: 12px; }
.tab { font-family: var(--f-display); font-weight: 700; text-transform: uppercase; letter-spacing: .06em; font-size: .78rem; padding: 8px 4px; border-radius: 9px; border: 0; background: transparent; color: var(--muted); cursor: pointer; }
.tab.on { background: var(--rule); color: var(--ink); }
.list { display: grid; gap: 8px; }
.card { display: grid; grid-template-columns: 40px minmax(0,1fr) auto; gap: 10px; align-items: center; padding: 10px; border-radius: 12px; border: 1px solid var(--rule); background: rgba(12,17,42,.75); }
button.card { width: 100%; text-align: left; font: inherit; color: inherit; cursor: pointer; }
.card.on { border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold) inset; }
.card h3 { margin: 0; font-family: var(--f-display); font-size: 1rem; letter-spacing: .03em; }
.card p { margin: 1px 0 5px; font-size: .76rem; color: var(--muted); }
.card .meta { min-width: 0; }
.shipico { justify-self: center; width: 0; height: 0; border-left: 12px solid transparent; border-right: 12px solid transparent; border-bottom: 24px solid var(--c); filter: drop-shadow(0 0 7px var(--c)); }
.card.locked .shipico, .card.locked .shipimg { opacity: .35; }
.shipimg { width: 44px; height: 44px; max-width: 100%; justify-self: center; }
.upico { justify-self: center; font-family: var(--f-display); font-weight: 700; font-size: 1.2rem; width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: rgba(39,48,97,.6); color: var(--c); }
.trailico { justify-self: center; width: 38px; height: 10px; border-radius: 99px; background: var(--c); border: 1px solid var(--rule); }
.statrow { display: grid; grid-template-columns: 3.7rem minmax(0,1fr); gap: 6px; align-items: center; font-family: var(--f-display); font-size: .62rem; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-top: 2px; }
.meter { height: 5px; background: rgba(39,48,97,.9); border-radius: 99px; overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--c); border-radius: 99px; }
.pips { display: flex; gap: 4px; margin-top: 2px; }
.pips i { width: 16px; height: 6px; border-radius: 2px; background: rgba(141,147,191,.28); }
.pips i.on { background: var(--gold); box-shadow: 0 0 6px rgba(255,204,77,.6); }
.buy { font-family: var(--f-display); font-weight: 700; font-size: .78rem; letter-spacing: .04em; padding: 8px 10px; border-radius: 9px; border: 0; background: var(--gold); color: var(--space); cursor: pointer; white-space: nowrap; }
.buy.ghosted { background: transparent; border: 1px solid var(--rule); color: var(--ink); }
.buy.eq { background: transparent; color: var(--gold); padding-inline: 4px; }
.buy.poor { background: rgba(255,204,77,.25); color: var(--ink); }
.buy:focus-visible, .tab:focus-visible, button.card:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

/* sats wallet */
.chip.sats { cursor: pointer; font: inherit; color: var(--ink); }
.chip.sats b { color: #f7931a; }
.wallet { justify-content: flex-start; align-items: stretch; text-align: left; gap: 12px; }
.demo { font-family: var(--f-display); font-size: .7rem; letter-spacing: .1em; text-transform: uppercase; color: var(--space); background: #f7931a; padding: 3px 8px; border-radius: 6px; align-self: flex-start; }
.wbig { font-family: var(--f-display); font-weight: 700; font-size: 3rem; line-height: 1; color: #f7931a; font-variant-numeric: tabular-nums; }
.wbig small { font-size: 1rem; color: var(--muted); margin-left: 6px; }
.wrow { display: flex; justify-content: space-between; gap: 10px; font-size: .9rem; padding: 8px 0; border-bottom: 1px solid var(--rule); font-variant-numeric: tabular-nums; }
.wrow span { color: var(--muted); }
.wsteps { margin: 0; padding-left: 1.1rem; display: grid; gap: 4px; font-size: .84rem; color: var(--ink); }
.notice { font-size: .84rem; border: 1px dashed #f7931a; border-radius: 10px; padding: 10px; color: var(--ink); }
.tagin { font-family: var(--f-display); font-size: 1rem; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--rule); background: rgba(7,10,26,.8); color: var(--ink); }
.tagin:focus-visible { outline: 2px solid var(--gold); outline-offset: 1px; }
.btn:disabled { opacity: .4; cursor: default; animation: none; }
.foot { font-size: .72rem; color: var(--muted); max-width: 420px; text-align: center; }
/* first-run tips */
/* v29 (audit, first 10 minutes): tips sit just under the HUD, out of the lane where meteors come in */
.tip { position: absolute; left: 50%; top: 10%; transform: translateX(-50%); width: min(86%, 290px); box-sizing: border-box; pointer-events: none;
  padding: 9px 14px 11px; border-radius: 14px; border: 1px solid var(--tide); background: rgba(7,10,26,.82); text-align: center;
  font-size: .9rem; line-height: 1.35; color: var(--ink); animation: drop .3s ease-out; box-shadow: 0 6px 24px rgba(0,0,0,.4); }
.tip .step { display: block; font-family: var(--f-display); font-size: .66rem; letter-spacing: .14em; text-transform: uppercase; color: var(--tide); margin-bottom: 3px; }
.tip b.g { color: var(--gold); } .tip b.t { color: var(--tide); }
.tip.ok { border-color: var(--gold); }
.tip.ok .step { color: var(--gold); }
.stage.tipping .toast { top: calc(10% + 84px); }
/* v32 (mission plan 1): radio comms. A crew portrait and a typed line; big for briefings, compact during runs */
.radio { position: absolute; left: 50%; top: 18%; transform: translateX(-50%); width: min(92%, 340px); box-sizing: border-box;
  display: grid; grid-template-columns: auto minmax(0,1fr); gap: 12px; align-items: center; text-align: left;
  padding: 8px 12px 8px 8px; border-radius: 12px; border: 1px solid var(--cc, var(--tide)); background: rgba(7,10,26,.9);
  box-shadow: 0 0 0 1px rgba(7,10,26,.6), 0 8px 28px rgba(0,0,0,.5); animation: radioin .28s cubic-bezier(.2,1.2,.4,1); }
.radio canvas { width: 64px; height: 64px; border-radius: 8px; display: block; border: 1px solid var(--rule); }
.radio .who { font-family: var(--f-display); font-weight: 700; font-size: 11.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--cc, var(--tide)); display: flex; justify-content: space-between; gap: 8px; }
.radio .who small { font-size: 11px; letter-spacing: .06em; color: var(--muted); font-weight: 500; }
.radio .say { font-size: 16px; line-height: 1.3; color: var(--ink); min-height: 2.6em; margin-top: 2px; }
.radio .say i { font-style: normal; opacity: 0; }
.radio.silence .say { color: #ffb3bb; text-shadow: 1px 0 rgba(255,79,98,.7), -1px 0 rgba(46,240,255,.35); }
.radio.mini { top: calc(8.5% + 6px); width: min(90%, 320px); gap: 8px; padding: 5px 10px 5px 5px; background: rgba(7,10,26,.62); pointer-events: none; animation-duration: .2s; }
.radio.mini canvas { width: 40px; height: 40px; }
.radio.mini .say { font-size: 15px; min-height: 0; }
.radio.mini .who small { display: none; }
@keyframes radioin { from { transform: translate(-50%, -16px); opacity: 0; } }
.stage.radioing .toast { top: calc(8.5% + 64px); }
/* v33: debrief card on the results screen: a crew face and one line */
.debrief { width: 100%; max-width: 300px; box-sizing: border-box; display: grid; grid-template-columns: auto minmax(0,1fr); gap: 12px; align-items: center; text-align: left;
  padding: 8px 12px 8px 8px; border-radius: 12px; border: 1px solid var(--cc); background: rgba(7,10,26,.7); }
.debrief canvas { width: 48px; height: 48px; border-radius: 8px; display: block; }

<script>
/* Meteor Pilot core: deterministic world, scoring rules, ghost bot, missions. No DOM. */
(function (root) {
  const W = 360, H = 640, SHIP_Y = 560, SHIP_R = 13, TPS = 60, MAX_T = TPS * 240;
  const MAX_LIVES = 4, MAGNET_T = TPS * 6, NOVA_R = 160, NEAR_BAND = 16;

  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6d2b79f5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;

  }
  function hashStr(s) { let h = 2166136261; for (const ch of s) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
  const EPOCH = Date.UTC(2026, 9, 25);
  function dayNumber(d) { return Math.floor((Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) - EPOCH) / 86400000) + 1; }

  const PARTNERS = [["🇧🇷","Brazil"],["🇳🇬","Nigeria"],["🇯🇵","Japan"],["🇮🇳","India"],["🇲🇽","Mexico"],["🇰🇪","Kenya"],["🇫🇷","France"],["🇭🇹","Haiti"],["🇮🇩","Indonesia"],["🇪🇬","Egypt"],["🇵🇭","the Philippines"],["🇩🇪","Germany"],["🇨🇦","Canada"],["🇦🇷","Argentina"],["🇻🇳","Vietnam"],["🇵🇱","Poland"]];
  const POWERS = ["shield", "magnet", "nova"];

  /* Every meteor, star, power-up and event is fixed by the seed, so everyone plays the same course. */
  const EVENT_LEN = { shower: TPS * 5, starrain: TPS * 4, gates: TPS * 5, streaks: TPS * 5 };
  function makeWorld(seed) {
    const rng = mulberry32(hashStr(String(seed)));
    const items = [], events = [];
    const order = ["shower", "gates", "starrain", "streaks"];
    for (let i = order.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); [order[i], order[j]] = [order[j], order[i]]; }
    for (let k = 0; k < 8; k++) { const t = TPS * (20 + k * 25); events.push({ t, type: order[k % 4], dur: EVENT_LEN[order[k % 4]] }); }
    const push = o => items.push(Object.assign({ id: items.length, vx: 0, zig: 0, zf: 0, spin: rng() * 6.28, power: null, gold: false, gate: -1, streak: false }, o));
    let next = 50, gid = 0, ei = 0;
    for (let t = 0; t < MAX_T; t++) {
      while (ei < events.length && t >= events[ei].t + events[ei].dur) ei++;
      const ev = events[ei] && t >= events[ei].t ? events[ei] : null;
      const secs = t / TPS, sp = 2.6 + secs * 0.028;
      if (ev) {
        const local = t - ev.t;
        if (ev.type === "shower" && local % 8 === 0) { const r = 9 + rng() * 9; push({ t, kind: "rock", r, x: r + rng() * (W - 2 * r), vy: sp + 1 + rng() * 1.6 }); }
        if (ev.type === "starrain" && local % 6 === 0) push({ t, kind: "star", r: 10, x: 20 + rng() * (W - 40), vy: 3 + rng(), gold: rng() < 0.06 });
        if (ev.type === "gates" && local % 70 === 0 && local < ev.dur - 40) {
          const gap = 84, gx = 30 + rng() * (W - 60 - gap);
          for (let x = 14; x <= W - 14; x += 26) if (x < gx - 12 || x > gx + gap + 12) push({ t, kind: "rock", r: 13, x, vy: 3.3, gate: gid });
          gid++;
        }
        if (ev.type === "streaks" && local % 34 === 20) push({ t, kind: "rock", r: 9, x: 20 + rng() * (W - 40), vy: 11, streak: true });
        next = ev.t + ev.dur + 40;
        continue;
      }
      if (t < next) continue;
      const roll = rng();
      const kind = secs > 8 && roll < 0.045 ? "power" : roll < 0.24 ? "star" : "rock";
      const r = kind === "rock" ? 11 + rng() * 13 : kind === "star" ? 10 : 13;
      const zig = kind === "rock" && secs > 12 && rng() < 0.2;
      push({
        t, kind, r, x: r + rng() * (W - 2 * r), vy: kind === "rock" ? sp + rng() * 0.8 : Math.min(sp, 3.4),
        vx: kind === "rock" && !zig ? (rng() - 0.5) * 0.6 : 0,
        zig: zig ? 28 + rng() * 34 : 0, zf: zig ? 0.035 + rng() * 0.03 : 0,
        power: kind === "power" ? POWERS[Math.floor(rng() * 3)] : null,
        gold: kind === "star" && secs > 15 && rng() < 0.08
      });
      next = t + Math.max(10, Math.round(40 - secs * 0.55 + rng() * 16));
    }
    const world = { seed: String(seed), items, events, partner: PARTNERS[Math.floor(rng() * PARTNERS.length)] };
    setBosses(world, DAILY_BOSSES);
    setWells(world, DAILY_WELLS);
    return setFlares(world, DAILY_FLARES);
  }

  /* ---------- Solar flares (v24): the sun flares for a few seconds and fires vertical heat beams down the screen.
     Each beam is marked for a full second (BEAM_WARN) before it burns (BEAM_FIRE). Own rng, so the course is unchanged. ---------- */
  const FLARE_LEN = TPS * 6, BEAM_WARN = 60, BEAM_FIRE = 30, BEAM_HW = 26, BEAM_EVERY = 55;
  /* v27: first flare at 48 s, so it ends before the first Mothership warning */
  const DAILY_FLARES = [48, 132, 177].map(s => TPS * s);
  /** Replace a world's solar flares. starts: ticks. Flares that overlap a boss or a black hole are dropped. */
  function setFlares(world, starts) {
    const rng = mulberry32(hashStr(world.seed + ":flare"));
    world.flares = (starts || []).map((t, i) => {
      const beams = [];
      for (let k = 0; k * BEAM_EVERY + BEAM_WARN + BEAM_FIRE <= FLARE_LEN - 20; k++) {
        const n = i >= 1 && k % 2 === 1 ? 2 : 1, xs = [];
        for (let q = 0; q < n; q++) {
          let x = 40 + rng() * (W - 80);
          for (let tries = 0; tries < 20 && xs.some(o => Math.abs(o - x) < 130); tries++) x = 40 + rng() * (W - 80);
          xs.push(x);
        }
        for (const x of xs) beams.push({ t: t + k * BEAM_EVERY, x, hw: BEAM_HW });
      }
      return { id: i, t, dur: FLARE_LEN, beams };
    });
    return refreshFlares(world);
  }
  function refreshFlares(world) {
    const wl = world.wellsLive || [];
    world.flaresLive = (world.flares || []).filter(f => !eventHidden(world, f) && !wl.some(w => w.t < f.t + f.dur && w.t + w.dur > f.t));
    return world;
  }
  /** Beams on screen at tick t: k = ticks since marked, live = burning now. */
  function beamsAt(world, t) {
    const out = [];
    if (world.flaresLive) for (const f of world.flaresLive) {
      if (t < f.t || t >= f.t + f.dur) continue;
      for (const b of f.beams) { const k = t - b.t; if (k >= 0 && k < BEAM_WARN + BEAM_FIRE) out.push({ b, x: b.x, hw: b.hw, k, live: k >= BEAM_WARN }); }
    }
    return out;
  }

  /* ---------- Black holes (v22): a gravity well opens between events. It bends the paths of everything falling
     past it, swallows what drifts into its core, tugs on the ship, and its core hurts. Own rng, so the course is unchanged. ---------- */
  const WELL_LEN = TPS * 7, WELL_RAMP = 60, WELL_CORE = 20, WELL_PULL = 3.4, WELL_RANGE = 300, WELL_BEND = 0.55, WELL_SIG = 150;
  /* v27: 77 s and 152 s moved to 88 s and 186 s so they no longer fall inside a Mothership fight and get dropped */
  const DAILY_WELLS = [27, 88, 186, 229].map(s => TPS * s);
  /** Replace a world's black holes. starts: ticks. Wells that overlap a boss are dropped. */
  function setWells(world, starts) {
    const rng = mulberry32(hashStr(world.seed + ":well"));
    world.wells = (starts || []).map((t, i) => ({ id: i, t, dur: WELL_LEN, x: 110 + rng() * (W - 220), y: 330 + rng() * 80, sway: 40 + rng() * 30, ph: rng() * 6.283 }));
    return refreshWells(world);
  }
  function refreshWells(world) {
    world.wellsLive = (world.wells || []).filter(w => !eventHidden(world, w));
    world.swallow = new Map(); world.swallowAt = new Map();
    for (const it of world.items) {
      if (hiddenAt(world, it.t)) continue;
      for (const w of world.wellsLive) {
        const tc = Math.ceil(it.t + (w.y + it.r) / it.vy);
        if (tc < w.t || tc >= w.t + w.dur) continue;
        const ws = wellState(w, tc), b = itemPos(it, tc), bx = b.x + (ws.x - b.x) * WELL_BEND * ws.s;
        if (ws.s > 0.25 && Math.abs(bx - ws.x) < WELL_CORE + it.r * 0.5) {
          world.swallow.set(it.id, tc);
          if (!world.swallowAt.has(tc)) world.swallowAt.set(tc, []);
          world.swallowAt.get(tc).push(it.id);
          break;
        }
      }
    }
    if (world.flares) refreshFlares(world);
    return world;
  }
  function wellAt(world, t) {
    if (world.wellsLive) for (const w of world.wellsLive) if (t >= w.t && t < w.t + w.dur) return w;
    return null;
  }

  /* The ghost: a decent but imperfect bot that reads only a short window ahead. */
  function ghostAim(world, g, rng) {

        const dt = (SHIP_Y - a.y) / a.it.vy;
        if (dt < -4 || dt > 34) continue;
        const reach = Math.abs(cx - g.x) / 3.0;
        const gap = Math.abs(posAt(world, a.it, g.t + Math.max(0, dt)).x - cx);
        if (a.it.kind !== "rock") { if (gap < 26 && reach <= dt + 2 && !g.got.has(a.it.id)) cost -= a.it.kind === "power" ? 5 : 3; }
        else if (!g.smashed.has(a.it.id) && gap < a.it.r + SHIP_R + 10) cost += 10 + (reach > dt ? 20 : 0);

          if (dt < -3 || dt > 40) continue;
          if (Math.abs(a.x + a.s.vx * Math.max(0, dt) - cx) < a.r + 14) cost += 12 + (reach > dt ? 20 : 0);

      if (bm) for (const a of bm) if (a.k > BEAM_WARN - 50 && Math.abs(cx - a.x) < a.hw + SHIP_R + 8) cost += 30;

        const reach = Math.abs(cx - g.x) / 3.0;
        for (const p of world.rescue.pods) {
          if (g.t < p.t - 30 || g.podDone.has(p.id)) continue;
          const t0 = Math.max(g.t, p.t), dt = (SHIP_Y - podAt(p, t0).y) / POD_VY;

        for (const m of world.beacon.motes) {

          if (g.moteDone.has(m.id)) continue;

          if (dt < -2 || dt > 70) continue;
          if (Math.abs(moteAt(m, g.t + Math.max(0, dt)).x - cx) < 18 && reach <= dt + 2) cost -= 1.5;
        }
      }
      if (world.heist) {
        const reach = Math.abs(cx - g.x) / 3.0;
        for (const f of world.heist.frags) {
          if (g.t < f.t - 30 || g.fragDone.has(f.id)) continue;
          const t0 = Math.max(g.t, f.t), dt = (SHIP_Y - fragAt(f, t0).y) / FRAG_VY;
          if (dt < -4 || dt > 120) continue;
          if (Math.abs(fragAt(f, t0 + Math.max(0, dt)).x - cx) < 20 && reach <= dt + 2) cost -= 12;
        }
        for (let dt = 0; dt <= 30; dt += 10) { const lt = lightAt(world, g.t + dt); if (lt && lt.on >= 0.6 && Math.abs(cx - lt.x) < lt.r + 16 && Math.abs(SHIP_Y - lt.y) < lt.r + 8) cost += 25; }

  /* v41 (mission plan 5): Race the Rival. Kestrel flies the same bot with her own seed and a few more lapses in focus,

  function recordGhost(world, opt) {

    const rng = mulberry32(hashStr(world.seed + tag));

  /* Three daily missions, the same for everyone that day.

  const MISSION_POOL = [
    { id: "stars", make: n => ({ text: `Grab ${n} stars in one run`, goal: n, of: r => r.stars }), sizes: [15, 25, 35] },

    { id: "ember", name: "Ember", cost: 60, body: "#ff6b4a", flame: "#ffd166", speed: 17, hit: 13, lives: 3, desc: "Fastest ship in the fleet" },
    { id: "aurora", name: "Aurora", cost: 180, body: "#7cf3a0", flame: "#4fb8ff", speed: 14, hit: 10.5, lives: 3, desc: "Tiny frame, slips through gaps" },
    { id: "nebula", name: "Nebula", cost: 400, body: "#ff7ad9", flame: "#9b7bff", speed: 13, hit: 13, lives: 4, desc: "Heavy armor, starts with 4 shields" },
    { id: "halo", name: "Halo", cost: 500, body: "#9fe8ff", flame: "#ffe08a", speed: 14, hit: 13, lives: 3, ability: "siphon", desc: "Star Siphon: every 15 stars restores a shield" },
    { id: "void", name: "Void", cost: 800, body: "#f4f1ff", flame: "#a26bff", speed: 16, hit: 11, lives: 4, desc: "Fast, small and armored" },

      novaR: NOVA_R + lv("nova") * 25, starMul: 1 + lv("value") * 0.1, keep: lv("guard") };
  }

  /* Replay a recorded run. inputs: [[ticksSincePrevChange, x, y], ...] with integer targets. */
  function replay(world, cfg, inputs) {
    const r = newRunner(cfg);
    let tx = W / 2, ty = SHIP_Y, i = 0, wait = inputs.length ? inputs[0][0] : Infinity;
    while (r.alive) {

      step(world, r, tx, cfg.speed, ty);

  }

  ];
  const DAILY = CR.missions(day); /* v33: the day's three missions (MISSIONS is now the story campaign table) */
  /* ---------- LEVELS + PILOT RANK (app-side; uses window.CR but never changes it) ---------- */
  function makeLevels(CR) {
    const TPS = CR.TPS;
    const WORLDS = [
      { name: "Neon Belt", need: 0, color: "#ff3ea5", shieldCut: 0, blurb: "Synthwave skies. Learn the ropes" },
      { name: "Red Circuit", need: 15, color: "#ff6a3d", shieldCut: 0, blurb: "Molten machines. Longer, faster runs" },
      { name: "Prism Rings", need: 35, color: "#7cf3ff", shieldCut: 0, blurb: "Ice and light. Solar flares join in" },
      { name: "Quantum Void", need: 60, color: "#b07bff", shieldCut: 1, blurb: "Reality glitches. One shield less" }
    ];
    const CYCLE = ["survive", "stars", "score", "close", "gates", "stars", "survive", "golden", "score", "finale"];
    const COUNT = WORLDS.length * 10;
    const cache = new Map();
    const round = (v, s) => Math.max(s, Math.round(v / s) * s);

    const GOALS = {
      survive: { text: L => `Reach the finish line`, of: () => 0 },
      finale: { text: L => `Survive ${L.dur}s and the Mothership`, of: () => 0 },
      stars: { text: L => `Grab ${L.goal} stars`, of: r => r.stars },
      score: { text: L => `Score ${L.goal.toLocaleString()} points`, of: r => r.score },
      close: { text: L => `Pull off ${L.goal} close calls`, of: r => r.near },
      gates: { text: L => `Fly through ${L.goal} gates`, of: r => r.gates },
      golden: { text: L => `Catch a golden star`, of: r => r.golds },
      escort: { text: L => `Escort the Light Ship to the finish`, of: () => 0 },
      rescue: { text: L => `Rescue ${L.goal} of ${L.podN} escape pods`, of: r => r.pods },
      blackout: { text: L => `Fly through the blackout to the finish`, of: () => 0 },
      race: { text: L => `Beat Kestrel: score ${L.goal.toLocaleString()}+`, of: r => r.score },
      heist: { text: L => `Steal ${L.goal} of ${L.fragN} core fragments`, of: r => r.frags },
      beacon: { text: L => `Light the beacon: catch ${L.goal} stars`, of: r => r.stars }
    };
    /* v38 (mission plan 5): escort missions. Level 16 is the first; more mission types join the cycle as they arrive */
    const SPECIAL = { 13: "rescue", 14: "race", 16: "escort", 18: "blackout", 23: "heist", 27: "beacon" };
    /* v40 blackout: the lights go out 3 s in and stay out until the finish */
    const DARK_FROM = 3;
    /* v39 rescue: 4 escape pods, spread so the last one reaches you before the finish */
    const POD_N = 4, RESCUE_GOAL = 3;
    const podStarts = dur => Array.from({ length: POD_N }, (_, k) => Math.round((3 + k * (dur - 11) / (POD_N - 1)) * TPS));
    /* v42 heist: 6 core fragments, steal 4. The searchlight switches on 2 s in (it can spot you from 3 s) */
    const FRAG_N = 6, HEIST_GOAL = 4, LIGHT_FROM = 2;
    const fragStarts = dur => Array.from({ length: FRAG_N }, (_, k) => Math.round((3 + k * (dur - 10) / (FRAG_N - 1)) * TPS));
    const heistSpec = durT => ({ from: LIGHT_FROM * TPS, until: durT, frags: fragStarts(durT / TPS) });
    /* v43 beacon: a light stream every 1.75 s from 2 s until 5 s before the finish; 50 stars lights it. 3rd star: lit with 10 s to spare */
    const BEACON_GOAL = 50, BEACON_SPARE = 10;
    const beaconSpec = durT => ({ goal: BEACON_GOAL, from: 2 * TPS, until: durT - 5 * TPS, every: 105 });

    function pickSeed(n, type, durT) {
      for (let k = 0; k < 200; k++) {
        const seed = `lvl-${n}-${k}`, world = CR.makeWorld(seed);
        if (n <= 10) CR.setWells(world, []);
        /* v39 rescue: only a course where the ghost bot (who never leaves the bottom row) still saves enough pods and finishes */
        if (type === "rescue") {
          CR.setBosses(world, []); CR.setWells(world, []); CR.setFlares(world, []); CR.setRescue(world, podStarts(durT / TPS));
          const g = CR.recordGhost(world);
          if (k < 60 && (g.pods < RESCUE_GOAL || g.t < durT)) continue;
        }
        /* v40 blackout: only a course the ghost bot (who ignores the dark) flies all the way through */
        if (type === "blackout" && k < 60) {
          CR.setBosses(world, []); CR.setWells(world, []); CR.setFlares(world, []);
          if (CR.recordGhost(world).t < durT) continue;
        }
        /* v41 race: a course where Kestrel flies to the finish and the ghost bot (a steady pilot) still beats her */
        if (type === "race" && k < 60) {
          CR.setBosses(world, []);
          const kr = CR.recordRival(world), gb = CR.recordGhost(world);
          if (kr.t < durT || gb.t < durT || CR.rivalScore(gb, durT) <= CR.rivalScore(kr, durT)) continue;
        }
        /* v42 heist: a course where the ghost bot (who keeps out of the light) steals enough fragments and finishes */
        if (type === "heist" && k < 60) {
          CR.setBosses(world, []); CR.setWells(world, []); CR.setFlares(world, []); CR.setHeist(world, heistSpec(durT));
          const g = CR.recordGhost(world);
          if (g.frags < HEIST_GOAL || g.t < durT) continue;
        }
        /* v43 beacon: a course where the ghost bot (who only drifts toward the streams) lights the beacon and finishes */
        if (type === "beacon" && k < 60) {
          CR.setBosses(world, []); CR.setWells(world, []); CR.setFlares(world, [14 * TPS]); CR.setBeacon(world, beaconSpec(durT));
          const g = CR.recordGhost(world);
          if (g.beaconLit == null || g.t < durT) continue;
        }
        if (type === "gates" && !(world.events[0].type === "gates")) continue;
        if (type === "golden" && !world.items.some(it => it.gold && it.t + 200 < durT && !world.swallow.has(it.id))) continue;
        if (type === "stars") {
          const avail = world.items.filter(it => it.kind === "star" && it.t + 180 < durT && !world.swallow.has(it.id)).length;
          if (avail < 8 + 2 * Math.floor((n - 1) / 10) || avail > 22) continue;
        }
        return { seed, world };
      }
      const seed = `lvl-${n}-0`; return { seed, world: CR.makeWorld(seed) };
    }

    /** Full definition of level n (1-based). Deterministic: same for every player. */
    function get(n) {
      if (cache.has(n)) return cache.get(n);
      const w = Math.floor((n - 1) / 10), i = (n - 1) % 10, type = SPECIAL[n] || CYCLE[i];
      let dur = Math.round(18 + w * 8 + i * 2);
      if (type === "gates") dur = Math.max(dur, 28);
      if (type === "finale") dur += 12;
      const durT = dur * TPS;
      const { seed, world } = pickSeed(n, type, durT);
      /* Finales end with a Mothership boss; tougher in later worlds. */
      if (type === "finale") CR.setBosses(world, [{ t0: durT - 22 * TPS, dur: 20 * TPS, lvl: w }]);
      else CR.setBosses(world, []); /* v27: the daily Mothership now comes at 1:00, so plain levels clear it out */
      /* Black holes start in the second world; Neon Belt stays a gentle introduction. */
      if (w === 0) CR.setWells(world, []);
      /* Solar flares start in the third world, early in the run, before the first black hole. */
      CR.setFlares(world, w >= 2 && type !== "finale" ? [14 * TPS] : []);
      /* escort runs keep the sky simple (no black hole tugging you out of the link ring) */
      if (type === "escort") CR.setWells(world, []);
      CR.setEscort(world, type === "escort" ? { hp: 3, until: durT } : null);
      if (type === "rescue") CR.setWells(world, []);
      CR.setRescue(world, type === "rescue" ? podStarts(dur) : null);
      /* blackout runs keep the sky simple too: no black hole or solar flare hiding in the dark */
      if (type === "blackout") { CR.setWells(world, []); CR.setFlares(world, []); }
      CR.setBlackout(world, type === "blackout" ? { from: DARK_FROM * TPS, until: durT } : null);
      /* heist runs keep the sky simple: the searchlight is the event */
      if (type === "heist") { CR.setWells(world, []); CR.setFlares(world, []); }
      CR.setHeist(world, type === "heist" ? heistSpec(durT) : null);
      /* beacon runs keep the flare (the light streams dodge around it) but no black hole */
      if (type === "beacon") CR.setWells(world, []);
      CR.setBeacon(world, type === "beacon" ? beaconSpec(durT) : null);
      const ghost = CR.recordGhost(world), rival = type === "race" ? CR.recordRival(world) : null;
      const starsAvail = world.items.filter(it => it.kind === "star" && it.t + 180 < durT && !CR.hiddenAt(world, it.t) && !world.swallow.has(it.id)).length;
      const baseScore = Math.floor(durT / 6) + Math.round(starsAvail * 25 * 0.55);
      let goal = 0;
      if (type === "stars") goal = Math.max(3, Math.min(starsAvail - 2, Math.round(starsAvail * (0.4 + w * 0.05))));
      if (type === "score") goal = round(baseScore * (0.75 + w * 0.05), 50);
      if (type === "close") goal = 2 + w + Math.floor(i / 4);
      if (type === "gates") goal = 2 + (w >= 2 ? 1 : 0);
      if (type === "golden") goal = 1;
      if (type === "rescue") goal = RESCUE_GOAL;
      if (type === "race") goal = CR.rivalScore(rival, durT) + 1;
      if (type === "heist") goal = HEIST_GOAL;
      if (type === "beacon") goal = BEACON_GOAL;
      /* escort: blocked rocks pay points, so its par sits higher (tuned with a bot that just shadows the Light Ship) */
      /* rescue: each saved pod pays 150, so its par counts the 3 pods the goal needs */
      const par = type === "beacon" ? round(Math.max(baseScore, ghost.score * 0.6), 50) : round(type === "score" ? goal * 1.2 : type === "race" ? goal * 1.12 : type === "escort" ? baseScore * 2.4 : type === "rescue" ? baseScore * (0.85 + w * 0.05) + RESCUE_GOAL * CR.POD_PTS : type === "heist" ? baseScore * (0.85 + w * 0.05) + HEIST_GOAL * CR.FRAG_PTS : baseScore * (0.85 + w * 0.05), 50);
      const par3 = round(par * 1.3, 50);
      const L = { n, w, i, type, dur, durT, seed, world, ghost, goal, par, par3, shieldCut: WORLDS[w].shieldCut, finale: type === "finale", podN: type === "rescue" ? POD_N : 0, fragN: type === "heist" ? FRAG_N : 0, rival };
      L.goalText = GOALS[type].text(L);
      cache.set(n, L);
      return L;
    }

    /** How far the runner is on the goal: { have, need, met } */
    function progress(L, r) {
      if (L.type === "survive" || L.type === "finale" || L.type === "escort" || L.type === "blackout") return { have: Math.min(r.t, L.durT), need: L.durT, met: r.t >= L.durT && !r.escLost };
      const have = GOALS[L.type].of(r);
      /* v41 race: beat Kestrel's score, or reach the finish after she has gone down */
      if (L.type === "race") return { have, need: L.goal, met: have >= L.goal || (L.rival.t < L.durT && r.t >= L.durT) };
      return { have, need: L.goal, met: have >= L.goal };
    }

    /** Star rating for a finished level run. finished = reached the finish line alive. */
    function rate(L, r, finished) {
      const met = finished && progress(L, r).met;
      const checks = [
        { text: L.type === "survive" || L.type === "finale" || L.type === "blackout" ? "Reach the finish" : L.type === "escort" ? "Bring the Light Ship to the finish" : L.type === "race" ? "Beat Kestrel to the finish" : L.goalText + " and finish", ok: met },
        { text: `Score ${L.par.toLocaleString()}+`, ok: met && r.score >= L.par },
        /* v28 (audit #3): a hit no longer costs the third star if you score well or win the shield back */
        L.type === "escort" ? { text: `Light Ship unharmed, or score ${L.par3.toLocaleString()}+`, ok: met && (r.escHp >= 3 || r.score >= L.par3) }
          : L.type === "rescue" ? { text: `All ${L.podN} pods rescued, or score ${L.par3.toLocaleString()}+`, ok: met && (r.pods >= L.podN || r.score >= L.par3) }
          : L.type === "heist" ? { text: `Never spotted, or score ${L.par3.toLocaleString()}+`, ok: met && (r.spotted === 0 || r.score >= L.par3) }
          : L.type === "beacon" ? { text: `Lit with ${BEACON_SPARE}s to spare, or score ${L.par3.toLocaleString()}+`, ok: met && ((r.beaconLit != null && r.beaconLit <= L.durT - BEACON_SPARE * TPS) || r.score >= L.par3) }
          : { text: `Full shields at the end, or score ${L.par3.toLocaleString()}+`, ok: met && (r.lives >= r.cfg.lives || r.score >= L.par3) }
      ];
      return { met, stars: met ? checks.filter(c => c.ok).length : 0, checks };
    }

    const total = levels => Object.values(levels).reduce((a, b) => a + b, 0);
    function worldOpen(levels, w) { return total(levels) >= WORLDS[w].need; }
    function levelOpen(levels, n) {
      const w = Math.floor((n - 1) / 10);
      if (!worldOpen(levels, w)) return false;
      return (n - 1) % 10 === 0 || (levels[n - 1] || 0) >= 1;
    }

    /* Pilot rank: XP from every run. */
    const xpNeed = lv => 80 + lv * 40;
    const RANKS = [[1, "Cadet"], [3, "Pilot"], [6, "Ace"], [10, "Captain"], [15, "Commander"], [20, "Legend"]];
    const rankName = lv => RANKS.filter(r => lv >= r[0]).pop()[1];
    function addXP(save, amount) {
      save.xp += amount;
      const ups = [];
      while (save.xp >= xpNeed(save.pilot)) { save.xp -= xpNeed(save.pilot); save.pilot++; ups.push(save.pilot); }
      return ups;
    }
    const runXP = (r, newLevelStars) => Math.floor(r.score / 10) + newLevelStars * 25;
    const levelUpCoins = () => 40; /* v26: flat, so ship unlocks stretch across the first week or so */

    return { WORLDS, COUNT, get, progress, rate, total, worldOpen, levelOpen, xpNeed, rankName, addXP, runXP, levelUpCoins, BEACON_SPARE };
  }

  const LV = makeLevels(CR);
  /* ---------- VISUAL THEMES (display only; never touches window.CR) ----------
     Each level = a named theme: two animated scenes layered, a hazard design, and its own palette.
     a = main neon, b = second neon, sky = top of the sky gradient. */
  function makeThemes(W, H) {
    const T = (name, scene, over, rock, a, b, sky) => ({ name, scene, over, rock, a, b, sky });
    const LIST = [
      // Neon Belt: synthwave neon
      T("Neon Horizon", "grid", "sonar", "wire", "#ff3ea5", "#3ef0ff", "#1a0630"),
      T("Pulse Avenue", "skyline", "warp", "wire", "#ff7ad9", "#7cf3ff", "#120a2e"),
      T("Chrome Tide", "aurora", "shards", "crystal", "#5ef3ff", "#b47cff", "#081a33"),
      T("Laser Garden", "circuit", "nebula", "drone", "#7dff9b", "#ff5ef1", "#071f1a"),
      T("Gatekeeper Arc", "tunnel", "sonar", "wire", "#3ef0ff", "#ffd23e", "#06152e"),
      T("Static Bloom", "data", "nebula", "glitch", "#ff4fd8", "#45ffd0", "#1c0626"),
      T("Velvet Drive", "grid", "aurora", "orb", "#ff8a3e", "#ff3e9a", "#200818"),
      T("Golden Signal", "sonar", "shards", "crystal", "#ffd23e", "#3ef0ff", "#14102a"),
      T("Mirror Mile", "warp", "circuit", "drone", "#9b8bff", "#3effc8", "#0c0c2e"),
      T("Neon Crown", "planet", "grid", "wire", "#ff3ea5", "#ffd23e", "#2a0838"),
      // Red Circuit: molten industry
      T("Rust Engine", "circuit", "warp", "wire", "#ff6a3d", "#ffb23e", "#2a0a06"),
      T("Dust Choir", "nebula", "shards", "orb", "#ff8c5a", "#ffd6a0", "#2b1208"),
      T("Furnace Lane", "tunnel", "data", "drone", "#ff3d2e", "#ffcc4d", "#240604"),
      T("Redline Relay", "skyline", "sonar", "glitch", "#ff2e5a", "#ffa03e", "#22040e"),
      T("Iron Gates", "grid", "circuit", "wire", "#ff7a3d", "#5ee8ff", "#1e0a08"),
      T("Ember Orchard", "aurora", "nebula", "crystal", "#ff9a3d", "#ff3d7a", "#2a0c10"),
      T("Overclock", "data", "tunnel", "glitch", "#ffb23e", "#ff3d3d", "#1a0a02"),
      T("Solar Vault", "planet", "sonar", "orb", "#ffd23e", "#ff6a3d", "#2a1404"),
      T("Magma Lattice", "shards", "circuit", "crystal", "#ff5a2e", "#ffe08a", "#200606"),
      T("Mars Reactor", "hole", "warp", "drone", "#ff3d2e", "#ffcc4d", "#300808"),
      // Prism Rings: ice and light
      T("Ring Cathedral", "planet", "aurora", "crystal", "#7cf3ff", "#ffe08a", "#061a2a"),
      T("Glass Orbit", "shards", "sonar", "crystal", "#a0f0ff", "#ff9ae0", "#0a1630"),
      T("Halo Drift", "aurora", "warp", "orb", "#6affd8", "#a08bff", "#04201c"),
      T("Frost Signal", "data", "shards", "wire", "#bdf4ff", "#5ea8ff", "#081428"),
      T("Prism Gate", "tunnel", "aurora", "crystal", "#ffe08a", "#7cf3ff", "#14182e"),
      T("Opal Current", "nebula", "circuit", "orb", "#ff9ae0", "#6affd8", "#1a0e2a"),
      T("Diamond Rain", "warp", "shards", "glitch", "#e0f8ff", "#7c9bff", "#0a0e24"),
      T("Saturn Choir", "planet", "sonar", "wire", "#ffd28a", "#7cf3ff", "#1a1406"),
      T("Polar Engine", "circuit", "aurora", "drone", "#5ee8ff", "#ffffff", "#04182a"),
      T("Crystal Crown", "planet", "tunnel", "crystal", "#ffe08a", "#ff9ae0", "#120c2a"),
      // Quantum Void: cosmic and glitched
      T("Event Horizon", "hole", "warp", "orb", "#b07bff", "#ff5ef1", "#08020f"),
      T("Null Signal", "data", "sonar", "glitch", "#9b7bff", "#3effc8", "#05030c"),
      T("Dark Bloom", "nebula", "hole", "orb", "#ff4fd8", "#7b5bff", "#0c0414"),
      T("Phase Tunnel", "tunnel", "data", "wire", "#8c7bff", "#ff3e9a", "#06041a"),
      T("Singularity Gate", "hole", "tunnel", "drone", "#c58bff", "#ffd23e", "#0a0418"),
      T("Ghost Lattice", "circuit", "shards", "glitch", "#7cffea", "#b07bff", "#040a10"),
      T("Zero Point", "sonar", "warp", "crystal", "#ffffff", "#9b7bff", "#06060e"),
      T("Shadow Aurora", "aurora", "hole", "orb", "#5ef3a0", "#c05bff", "#04100c"),
      T("Paradox Mile", "grid", "data", "glitch", "#ff3ea5", "#3ef0ff", "#0a0414"),
      T("Quantum Throne", "hole", "planet", "crystal", "#ffd23e", "#b07bff", "#0c0420")
    ];
    LIST.forEach((th, i) => { th.n = i + 1; th.world = Math.floor(i / 10); th.glitchFx = th.world === 3; });

    // ---- helpers ----
    const hex = (c, a) => { const n = parseInt(c.slice(1), 16); return `rgba(${n >> 16 & 255},${n >> 8 & 255},${n & 255},${a})`; };
    function rng(seed) { let s = 0; for (const ch of seed) s = (s * 31 + ch.charCodeAt(0)) >>> 0; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296); }
    const caches = new Map();
    function cached(key, w, h, paint) {
      if (caches.has(key)) return caches.get(key);
      const c = document.createElement("canvas"); c.width = w * 2; c.height = h * 2;
      const g = c.getContext("2d"); g.scale(2, 2); paint(g);
      caches.set(key, c); return c;
    }
    const WARP = Array.from({ length: 70 }, (_, i) => ({ a: (i * 2.399) % 6.283, d: (i * 37) % 420, v: 0.6 + (i * 13 % 10) / 10 }));
    const SHARDS = Array.from({ length: 24 }, (_, i) => ({ x: (i * 97) % W, y: (i * 151) % H, s: 6 + (i * 7) % 18, r: i, z: 0.3 + (i % 4) * 0.25 }));
    const COLS = Array.from({ length: 14 }, (_, i) => ({ x: 12 + i * 25.5, sp: 0.8 + (i * 7 % 5) * 0.3, off: (i * 113) % H }));

    // ---- scenes: each draws on top of the sky, low contrast so hazards stay readable ----
    const SCENES = {
      grid(ctx, t, th, k) {
        const hz = H * 0.3;
        const sun = ctx.createLinearGradient(0, hz - 80, 0, hz);
        sun.addColorStop(0, hex(th.b, .55 * k)); sun.addColorStop(1, hex(th.a, .45 * k));
        ctx.save(); ctx.beginPath(); ctx.arc(W / 2, hz, 72, Math.PI, 0); ctx.clip();
        ctx.fillStyle = sun; ctx.fillRect(W / 2 - 72, hz - 72, 144, 72);
        ctx.fillStyle = th.sky; for (let i = 0; i < 6; i++) ctx.fillRect(W / 2 - 72, hz - 6 - i * 11, 144, 2 + i * 0.6);
        ctx.restore();
        ctx.strokeStyle = hex(th.a, .22 * k); ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(0, hz); ctx.lineTo(W, hz); ctx.stroke();
        for (let i = -9; i <= 9; i++) { ctx.beginPath(); ctx.moveTo(W / 2 + i * 6, hz); ctx.lineTo(W / 2 + i * 70, H); ctx.stroke(); }
        const ph = (t * 0.012) % 1;
        for (let i = 0; i < 12; i++) { const z = (i + ph) / 12, y = hz + (H - hz) * z * z; ctx.globalAlpha = z; ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
        ctx.globalAlpha = 1;
      },
      tunnel(ctx, t, th, k) {
        const cx = W / 2, cy = H * 0.36;
        for (let i = 0; i < 11; i++) {
          const s = ((i + t * 0.008) % 11) / 11, r = 6 + s * s * 560;
          ctx.strokeStyle = hex(i % 2 ? th.a : th.b, .32 * s * k); ctx.lineWidth = 1 + s * 2.5;
          ctx.beginPath();
          for (let j = 0; j <= 6; j++) { const an = j / 6 * 6.283 + t * 0.004 + i * 0.12; const px = cx + Math.cos(an) * r, py = cy + Math.sin(an) * r * 0.9; j ? ctx.lineTo(px, py) : ctx.moveTo(px, py); }
          ctx.stroke();
        }
      },
      warp(ctx, t, th, k) {
        const cx = W / 2, cy = H * 0.34;
        ctx.lineWidth = 1.3;
        for (const s of WARP) {
          const d = (s.d + t * s.v * 2.2) % 420, len = 6 + d * 0.18;
          ctx.strokeStyle = hex(s.d % 3 ? th.a : "#ffffff", Math.min(.5, d / 420) * k);
          const c = Math.cos(s.a), sn = Math.sin(s.a);
          ctx.beginPath(); ctx.moveTo(cx + c * d, cy + sn * d); ctx.lineTo(cx + c * (d + len), cy + sn * (d + len)); ctx.stroke();
        }
      },
      nebula(ctx, t, th, k) {
        const img = cached("neb" + th.name, W, H, g => {
          const r = rng(th.name);
          for (let i = 0; i < 9; i++) {
            const x = r() * W, y = r() * H, rad = 80 + r() * 140, col = i % 2 ? th.a : th.b;
            for (const oy of [-H, 0, H]) {
              const gr = g.createRadialGradient(x, y + oy, 0, x, y + oy, rad); gr.addColorStop(0, hex(col, .22)); gr.addColorStop(1, hex(col, 0));
              g.fillStyle = gr; g.fillRect(0, 0, W, H);
            }
          }
        });
        const y = (t * 0.25) % H;
        ctx.globalAlpha = k; ctx.drawImage(img, 0, y, W, H); ctx.drawImage(img, 0, y - H, W, H); ctx.globalAlpha = 1;
      },
      circuit(ctx, t, th, k) {
        const img = cached("cir" + th.name, W, H, g => {
          const r = rng(th.name + "c");
          g.lineWidth = 1.2; g.lineCap = "round";
          for (let i = 0; i < 34; i++) {
            let x = Math.round(r() * 18) * 20, y = Math.round(r() * 32) * 20;
            g.strokeStyle = hex(i % 3 ? th.a : th.b, .28); g.beginPath(); g.moveTo(x, y);
            for (let s = 0; s < 4; s++) { if (r() < .5) x += (r() < .5 ? -1 : 1) * 20 * (1 + Math.floor(r() * 3)); else y += 20 * (1 + Math.floor(r() * 3)); g.lineTo(x, y); }
            g.stroke(); g.fillStyle = hex(th.b, .45); g.beginPath(); g.arc(x, y, 2.5, 0, 6.283); g.fill();
          }
        });
        const y = (t * 0.9) % H;
        ctx.globalAlpha = k; ctx.drawImage(img, 0, y, W, H); ctx.drawImage(img, 0, y - H, W, H);
        ctx.fillStyle = hex(th.b, .9);
        for (let i = 0; i < 6; i++) { const x = 20 + i * 64, py = (t * 3 + i * 137) % H; ctx.fillRect(x - 1, py, 2, 14); }
        ctx.globalAlpha = 1;
      },
      planet(ctx, t, th, k) {
        const img = cached("pl" + th.name, W, H, g => {
          const px = W * 0.78, py = H * 0.2, pr = 115;
          const gr = g.createRadialGradient(px - 40, py - 40, 10, px, py, pr);
          gr.addColorStop(0, hex(th.b, .5)); gr.addColorStop(.7, hex(th.a, .28)); gr.addColorStop(1, hex(th.sky, .9));
          g.fillStyle = gr; g.beginPath(); g.arc(px, py, pr, 0, 6.283); g.fill();
          g.strokeStyle = hex(th.a, .12); g.lineWidth = 6;
          for (let i = -3; i <= 3; i++) { g.beginPath(); g.ellipse(px, py + i * 22, pr * Math.sqrt(1 - (i * 22 / pr) ** 2), 4, 0, 0, 6.283); g.stroke(); }
          g.save(); g.translate(px, py); g.rotate(-0.35);
          for (let i = 0; i < 4; i++) { g.strokeStyle = hex(i % 2 ? th.b : th.a, .32 - i * .05); g.lineWidth = 5 - i; g.beginPath(); g.ellipse(0, 0, pr * (1.45 + i * .12), pr * (0.26 + i * .03), 0, 0, 6.283); g.stroke(); }
          g.restore();
        });
        ctx.globalAlpha = k; ctx.drawImage(img, Math.sin(t * 0.002) * 6, Math.cos(t * 0.0017) * 4, W, H); ctx.globalAlpha = 1;
      },
      aurora(ctx, t, th, k) {
        for (let b = 0; b < 3; b++) {
          const base = H * (0.14 + b * 0.13), col = b % 2 ? th.b : th.a;
          const gr = ctx.createLinearGradient(0, base - 30, 0, base + 90);
          gr.addColorStop(0, hex(col, 0)); gr.addColorStop(.3, hex(col, .2 * k)); gr.addColorStop(1, hex(col, 0));
          ctx.fillStyle = gr; ctx.beginPath(); ctx.moveTo(0, H * 0.7);
          for (let x = 0; x <= W; x += 18) ctx.lineTo(x, base + Math.sin(x * 0.018 + t * 0.012 * (1 + b * 0.3) + b) * 26 + Math.sin(x * 0.05 + t * 0.02) * 8);
          ctx.lineTo(W, H * 0.7); ctx.closePath(); ctx.fill();
        }
      },
      /* v28 (audit #4): the scenery black hole is a faint swirl with no black core, so it never looks like the real hazard */
      hole(ctx, t, th, k) {
        const cx = W * 0.5, cy = H * 0.27;
        const glow = ctx.createRadialGradient(cx, cy, 10, cx, cy, 170);
        glow.addColorStop(0, hex(th.a, .14 * k)); glow.addColorStop(1, hex(th.a, 0));
        ctx.fillStyle = glow; ctx.fillRect(cx - 180, cy - 180, 360, 360);
        ctx.save(); ctx.translate(cx, cy);
        for (let i = 0; i < 4; i++) {
          ctx.rotate(0.02); ctx.strokeStyle = hex(i % 2 ? th.b : th.a, (.2 - i * .035) * k); ctx.lineWidth = 1.6 - i * .25;
          ctx.setLineDash([18 + i * 6, 12 + i * 4]); ctx.lineDashOffset = -t * (1.2 - i * .15);
          ctx.beginPath(); ctx.ellipse(0, 0, 70 + i * 16, 16 + i * 4, -0.2, 0, 6.283); ctx.stroke();
        }
        ctx.setLineDash([]);
        ctx.restore();
      },
      data(ctx, t, th, k) {
        ctx.font = "600 13px ui-monospace, Menlo, monospace"; ctx.textAlign = "center";
        const G = "0123456789ABCDEF";
        for (const c of COLS) {
          const head = (c.off + t * c.sp * 2) % (H + 160);
          for (let j = 0; j < 8; j++) {
            const y = head - j * 17; if (y < 0 || y > H) continue;
            ctx.fillStyle = j === 0 ? hex("#ffffff", .5 * k) : hex(j % 2 ? th.a : th.b, (.32 - j * .035) * k);
            ctx.fillText(G[(Math.floor(t / 7) + j * 5 + c.x) % 16 | 0], c.x, y);
          }
        }
      },
      shards(ctx, t, th, k) {
        for (const s of SHARDS) {
          const y = (s.y + t * s.z * 0.9) % (H + 40) - 20;
          ctx.save(); ctx.translate(s.x, y); ctx.rotate(t * 0.01 * (s.r % 2 ? 1 : -1) + s.r);
          ctx.strokeStyle = hex(s.r % 2 ? th.a : th.b, .4 * s.z * k); ctx.fillStyle = hex(s.r % 2 ? th.a : th.b, .06 * k); ctx.lineWidth = 1.2;
          ctx.beginPath(); ctx.moveTo(0, -s.s); ctx.lineTo(s.s * .6, s.s * .5); ctx.lineTo(-s.s * .6, s.s * .5); ctx.closePath(); ctx.fill(); ctx.stroke();
          ctx.restore();
        }
      },
      sonar(ctx, t, th, k) {
        const cx = W / 2, cy = H * 0.42;
        for (let i = 0; i < 4; i++) {
          const p = ((t + i * 45) % 180) / 180;
          ctx.strokeStyle = hex(i % 2 ? th.a : th.b, .35 * (1 - p) * k); ctx.lineWidth = 2;
          ctx.beginPath(); ctx.arc(cx, cy, 10 + p * 360, 0, 6.283); ctx.stroke();
        }
        const an = t * 0.02;
        const sw = ctx.createLinearGradient(cx, cy, cx + Math.cos(an) * 300, cy + Math.sin(an) * 300);
        sw.addColorStop(0, hex(th.a, .28 * k)); sw.addColorStop(1, hex(th.a, 0));
        ctx.strokeStyle = sw; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + Math.cos(an) * 300, cy + Math.sin(an) * 300); ctx.stroke();
      },
      skyline(ctx, t, th, k) {
        const img = cached("sky" + th.name, W, H, g => {
          const r = rng(th.name + "s");
          for (const side of [0, 1]) {
            let y = 0;
            while (y < H) {
              const bh = 40 + r() * 70, bw = 22 + r() * 42, x = side ? W - bw : 0;
              g.fillStyle = hex(th.sky, .95); g.fillRect(x, y, bw, bh - 4);
              g.strokeStyle = hex(th.a, .35); g.lineWidth = 1; g.strokeRect(x + .5, y + .5, bw - 1, bh - 5);
              for (let wy = y + 6; wy < y + bh - 10; wy += 8) for (let wx = x + 4; wx < x + bw - 4; wx += 7) if (r() < .35) { g.fillStyle = hex(r() < .5 ? th.a : th.b, .55); g.fillRect(wx, wy, 3, 3); }
              y += bh;
            }
          }
        });
        const y = (t * 1.4) % H;
        ctx.globalAlpha = k; ctx.drawImage(img, 0, y, W, H); ctx.drawImage(img, 0, y - H, W, H); ctx.globalAlpha = 1;
      }
    };

    const skyCache = new Map();
    const mix = (c1, c2, k) => { const a = parseInt(c1.slice(1), 16), b = parseInt(c2.slice(1), 16), f = s => Math.round((a >> s & 255) * (1 - k) + (b >> s & 255) * k); return `rgb(${f(16)},${f(8)},${f(0)})`; };
    /* warm: 0..1. v36 Fever warms the sky by swapping in a warmer cached sky gradient (4 steps), so it costs nothing extra per frame */
    function drawBackground(ctx, t, th, lite, warm) {
      const q = warm > 0 ? Math.ceil(Math.min(1, warm) * 4) / 4 : 0, key = th.sky + ":" + q;
      let bg = skyCache.get(key);
      if (!bg) { bg = ctx.createLinearGradient(0, 0, 0, H); bg.addColorStop(0, q ? mix(th.sky, "#ff7a3d", .36 * q) : th.sky); if (q) bg.addColorStop(.6, mix("#04050d", "#ff5a6e", .1 * q)); bg.addColorStop(1, q ? mix("#04050d", "#3a0a1c", .8 * q) : "#04050d"); skyCache.set(key, bg); }
      ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
      SCENES[th.scene](ctx, t, th, 1);
      if (!lite) SCENES[th.over](ctx, t, th, 0.55);
    }

    /* Occasional glitch slices for the Quantum Void (copies a strip of the finished frame sideways). */
    function glitch(ctx, canvas, t, th) {
      if (!th.glitchFx || (t % 170) > 9) return;
      ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0);
      const h = canvas.height, w = canvas.width;
      for (let i = 0; i < 3; i++) {
        const y = ((t * 37 + i * 211) % 97) / 97 * h, sh = h * (0.015 + i * 0.01), dx = (i % 2 ? 1 : -1) * w * 0.02;
        ctx.globalAlpha = .8; ctx.drawImage(canvas, 0, y, w, sh, dx, y, w, sh);
      }
      ctx.restore();
    }

    /* Hazard designs. Every one fills the hit circle so what you see is what hits you. */
    function drawHazard(ctx, style, a, t, th, shape, tint) {
      const it = a.it, r = it.r, col = tint || th.a;
      if (style === "rock") return false;
      ctx.save(); ctx.translate(a.x, a.y);
      const tg = ctx.createLinearGradient(0, 0, -it.vx * 18, -r * 3.4);
      tg.addColorStop(0, hex(col, .4)); tg.addColorStop(1, hex(col, 0));
      ctx.fillStyle = tg; ctx.beginPath(); ctx.moveTo(-r * .7, 0); ctx.lineTo(-it.vx * 18, -r * 3.4); ctx.lineTo(r * .7, 0); ctx.fill();
      const rot = it.spin + t * 0.02 * (it.id % 2 ? 1 : -1);
      ctx.shadowColor = col; ctx.shadowBlur = 12;
      if (style === "wire") {
        ctx.rotate(rot); ctx.fillStyle = "rgba(4,5,13,.75)"; ctx.strokeStyle = col; ctx.lineWidth = 2;
        ctx.beginPath(); for (const [px, py] of shape) ctx.lineTo(px * r, py * r); ctx.closePath(); ctx.fill(); ctx.stroke();
        ctx.shadowBlur = 0; ctx.strokeStyle = hex(th.b, .8); ctx.lineWidth = 1; ctx.rotate(0.6);
        ctx.beginPath(); for (const [px, py] of shape) ctx.lineTo(px * r * .55, py * r * .55); ctx.closePath(); ctx.stroke();
        ctx.beginPath(); for (let i = 0; i < shape.length; i += 3) { ctx.moveTo(0, 0); ctx.lineTo(shape[i][0] * r * .55, shape[i][1] * r * .55); } ctx.stroke();
      } else if (style === "crystal") {
        ctx.rotate(rot * 0.5);
        const pts = [[0, -1.15], [.7, -.35], [.85, .45], [0, 1], [-.85, .45], [-.7, -.35]];
        const gr = ctx.createLinearGradient(-r, -r, r, r); gr.addColorStop(0, "#ffffff"); gr.addColorStop(.35, col); gr.addColorStop(1, hex(th.sky, 1));
        ctx.fillStyle = gr; ctx.beginPath(); for (const [px, py] of pts) ctx.lineTo(px * r, py * r); ctx.closePath(); ctx.fill();
        ctx.shadowBlur = 0; ctx.strokeStyle = "rgba(255,255,255,.65)"; ctx.lineWidth = 1;
        ctx.beginPath(); for (const [px, py] of pts) { ctx.moveTo(0, -r * .1); ctx.lineTo(px * r, py * r); } ctx.stroke();
      } else if (style === "orb") {
        const p = 1 + Math.sin(t * 0.12 + it.id) * 0.06;
        const gr = ctx.createRadialGradient(-r * .3, -r * .3, r * .05, 0, 0, r * p);
        gr.addColorStop(0, "#ffffff"); gr.addColorStop(.35, col); gr.addColorStop(1, hex(th.b, .25));
        ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(0, 0, r * p, 0, 6.283); ctx.fill();
        ctx.shadowBlur = 0; ctx.strokeStyle = hex(th.b, .85); ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.ellipse(0, 0, r * 1.35, r * .38, rot, 0, 6.283); ctx.stroke();
      } else if (style === "drone") {
        ctx.rotate(rot);
        ctx.fillStyle = "rgba(6,8,20,.92)"; ctx.strokeStyle = col; ctx.lineWidth = 2;
        ctx.beginPath(); for (let i = 0; i < 6; i++) { const an = i / 6 * 6.283; ctx.lineTo(Math.cos(an) * r, Math.sin(an) * r); } ctx.closePath(); ctx.fill(); ctx.stroke();
        ctx.shadowBlur = 0; ctx.strokeStyle = hex(col, .7); ctx.lineWidth = 2.5;
        for (let i = 0; i < 3; i++) { const an = i / 3 * 6.283; ctx.beginPath(); ctx.moveTo(Math.cos(an) * r, Math.sin(an) * r); ctx.lineTo(Math.cos(an) * r * 1.3, Math.sin(an) * r * 1.3); ctx.stroke(); }
        const on = Math.floor(t / 10 + it.id) % 2;
        ctx.fillStyle = on ? "#ffffff" : th.b; ctx.shadowColor = th.b; ctx.shadowBlur = on ? 14 : 4;
        ctx.beginPath(); ctx.arc(0, 0, r * .3, 0, 6.283); ctx.fill();
      } else if (style === "glitch") {
        ctx.rotate(rot * 0.3);
        const j = (Math.floor(t / 3 + it.id) % 5) - 2, s = r * 1.5;
        ctx.globalCompositeOperation = "lighter"; ctx.shadowBlur = 0;
        ctx.fillStyle = hex("#ff2e5a", .7); ctx.fillRect(-s / 2 + j, -s / 2, s, s);
        ctx.fillStyle = hex("#2ef0ff", .7); ctx.fillRect(-s / 2 - j, -s / 2 + j * .5, s, s);
        ctx.globalCompositeOperation = "source-over";
        ctx.fillStyle = hex(col, .9); ctx.fillRect(-s * .35, -s * .35, s * .7, s * .7);
        ctx.fillStyle = "rgba(4,5,13,.8)"; ctx.fillRect(-s * .35, -s * .1 + j, s * .7, s * .12);
      }
      ctx.restore();
      return true;
    }

    const forLevel = n => LIST[(n - 1) % LIST.length];
    const forDay = d => LIST[(d * 7 + 3) % LIST.length];
    return { LIST, forLevel, forDay, drawBackground, drawHazard, glitch, hex };
  }

  const TH = makeThemes(CR.W, CR.H);
  /* ---------- 3D METEORS (display only) ----------
     Each asteroid is a textured sphere: a height + color map wrapped around it, craters cut in,
     a lumpy silhouette, lit from the top left with a hot glow underneath. We pre-render
     FRAMES rotation frames per variant once, then the game just picks a frame. */

          <span class="sw ${c.kind}" style="background:${swatch(c)}">${c.kind === "badge" ? "✦" : ""}</span><b>${c.name}</b><small>${RARITY[c.rarity].name} ${kindName(c.kind)}${on ? " · on" : ""}</small></button>`;

  function buyWithCoins(id) {
    const c = cosById(id), price = RARITY[c.rarity].coins;
    if (save.cos.includes(id)) return;
    if (save.coins < price) { sfx.near(); return renderShop(`You need ◉ ${price - save.coins} more coins. Play a run or finish a mission.`); }
    save.coins -= price; save.cos.push(id);
    if (c.kind === "paint") save.paint = id; else if (c.kind === "boom") { save.boom = id; pvSet(id, false); } else save.badge = id;
    persist(); paintChips(); sfx.power();
    renderShop(`${c.name} unlocked and equipped.`);
  }

  /* ---------- SHIP EXPLOSIONS (v23; cosmetic only, never touches window.CR) ----------

  const slotOf = k => k === "paint" ? save.paint : k === "boom" ? save.boom : save.badge;

    pixel: {

    nova: {

    },
    prism: {

        for (let i = 0; i < 36; i++) { const a = Math.random() * 6.283, s = 2 + Math.random() * 3.5; B.p.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 45 + Math.random() * 20, hue: i * 10, tri: true, s: 4 + Math.random() * 3 }); }

  /* The equipped effect, falling back to Classic if it isn't owned. */
  function boomKey() { const c = save.boom && cosById(save.boom); return c && c.fx && save.cos.includes(c.id) ? c.fx : "classic"; }
  function boomStep(B) {
    for (const b of B.b) {
      b.t++;
      if (b.type === "fw") for (const s of b.shells) if (!s.done && b.t >= s.d) {
        s.done = true; const tx = b.x + s.dx, ty = b.y + s.dy;
        fxBurst(B, tx, ty, s.c, 26, 2.2, { g: .05 }); fxBurst(B, tx, ty, "#ffffff", 6, 1);
        B.r.push({ x: tx, y: ty, r: 2, max: 50, c: rgbOf(s.c), v: 3.5, w: 2 });
      }
      if (b.type === "imp") {
        if (b.t < 22 && b.t % 2 === 0) for (let k = 0; k < 4; k++) { const a = Math.random() * 6.283; B.p.push({ x: b.x + Math.cos(a) * 70, y: b.y + Math.sin(a) * 70, vx: -Math.cos(a) * 3.6, vy: -Math.sin(a) * 3.6, life: 19, color: k % 2 ? "#c58bff" : "#ffd696", s: 2.5 }); }
        if (b.t === 22) {
          fxBurst(B, b.x, b.y, "#c58bff", 40, 3.2); fxBurst(B, b.x, b.y, "#ffffff", 16, 2);
          B.r.push({ x: b.x, y: b.y, r: 6, max: 230, c: "197,139,255", v: 8, w: 4 }, { x: b.x, y: b.y, r: 2, max: 120, c: "255,214,150", v: 5, w: 2 });
        }
      }
    }
    prune(B.b, b => b.t < b.life);
  }
  function fxDrawRings(g, list) {
    for (const r of list) { g.strokeStyle = `rgba(${r.c || "255,255,255"},${Math.max(0, 1 - r.r / r.max)})`; g.lineWidth = r.w || 3; g.beginPath(); g.arc(r.x, r.y, Math.max(0, r.r), 0, 6.28); g.stroke(); }
  }
  function fxDrawParticles(g, list) {
    for (const p of list) {
      const s = p.s || 3; g.globalAlpha = Math.max(0, Math.min(1, p.life / 50));
      g.fillStyle = p.hue != null ? `hsl(${(p.hue + p.life * 8) % 360},95%,65%)` : p.color;
      if (p.tri) { g.save(); g.translate(p.x, p.y); g.rotate(p.life * .25); g.beginPath(); g.moveTo(0, -s); g.lineTo(s * .8, s * .6); g.lineTo(-s * .8, s * .6); g.closePath(); g.fill(); g.restore(); }
      else g.fillRect(p.x - s / 2, p.y - s / 2, s, s);
    }
    g.globalAlpha = 1;
  }
  function fxDrawBooms(g, list) {
    for (const b of list) {
      if (b.type === "fw") for (const s of b.shells) {
        if (s.done) continue;
        const q = b.t / s.d, x = b.x + s.dx * q, y = b.y + s.dy * q;
        g.strokeStyle = "rgba(255,214,150,.7)"; g.lineWidth = 2; g.beginPath(); g.moveTo(b.x + s.dx * q * .6, b.y + s.dy * q * .6); g.lineTo(x, y); g.stroke();
        g.fillStyle = "#ffffff"; g.fillRect(x - 1.5, y - 1.5, 3, 3);
      }
      if (b.type === "gl" && b.t < 42) {
        const k = (1 - b.t / 42) * (calm() ? .45 : 1);
        g.save(); g.globalCompositeOperation = "lighter";
        for (let i = 0; i < 7; i++) {
          const w = 10 + Math.random() * 60 * k, h = 3 + Math.random() * 10, ox = (Math.random() - .5) * 100, oy = (Math.random() - .5) * 64;
          g.fillStyle = i % 2 ? `rgba(46,240,255,${.55 * k})` : `rgba(255,46,90,${.55 * k})`; g.fillRect(b.x + ox - w / 2, b.y + oy - h / 2, w, h);

        g.fillStyle = "#000"; g.beginPath(); g.arc(b.x, b.y, R, 0, 6.283); g.fill();
        g.strokeStyle = "rgba(255,255,255,.85)"; g.lineWidth = 1.4; g.beginPath(); g.arc(b.x, b.y, R + 1, 0, 6.283); g.stroke();
        g.restore();
      }
    }
  }
  /* Shop preview: the ship drifts, blows up with the chosen effect, and loops. */
  let pvKey = "classic", pvT = 39;
  const PV = { p: [], r: [], b: [] };
  function pvSet(key, loud) {
    pvKey = key; pvT = 39; PV.p.length = 0; PV.r.length = 0; PV.b.length = 0;
    if (loud) { const c = key !== "classic" && cosById(key); (BOOMS[c ? c.fx : "classic"] || BOOMS.classic).snd(); if (!c) tone(196, .3, "sawtooth", .07, -80); }
  }
  function drawBoomPreview() {
    const cvs = $("#boom-prev"); if (!cvs) return;
    const g = cvs.getContext("2d"), s = cvs.width / W, y = 92, look = shipLook();
    const c = pvKey !== "classic" && cosById(pvKey), fx = BOOMS[c ? c.fx : "classic"] || BOOMS.classic;
    g.setTransform(s, 0, 0, s, 0, 0);
    TH.drawBackground(g, bgT, theme || TH.LIST[0], true);
    pvT++;
    const cyc = pvT % 130, sx = W / 2 + Math.sin(pvT * 0.05) * 40;
    if (cyc === 40) fx.play(PV, sx, y, look.body);
    if (cyc < 40) SHIP3D.draw(g, sx, y, { body: look.body, flame: look.flame, model: SHIP3D.model(skin().id), alpha: Math.min(1, cyc / 10), roll: -Math.cos(pvT * 0.05) * 0.4, t: pvT, scale: 1.1, thrust: true, lights: true });

  }

  /* v29: a player with no runs yet gets Level 1 (18 s, no black holes or flares) instead of the full daily course */

      <div class="btns">${mode === "random" ? `<button class="btn alt" id="daily">Back to daily course</button>` : ""}${first ? `<button class="btn alt" id="play-daily">Daily course</button>` : ""}<button class="btn alt" id="shop-btn">🛒 Shop${giftReady() ? " •" : ""}</button><button class="btn alt" id="trophies-btn">🏆 Trophies ${trophyCount()}/${TROPHIES.length}</button><button class="btn alt" id="settings-btn">⚙ Settings</button>${save.tutDone ? `<button class="btn alt" id="howto">Play with tips</button>` : ""}</div>
      <details class="news"><summary>What's new · v${CHANGELOG[0].v}</summary><ul>${CHANGELOG[0].notes.map(n => `<li>${n}</li>`).join("")}</ul></details>`;

  // ---------- SETTINGS (v21; display + input only, never touches window.CR) ----------
  const SETTINGS = [
    { k: "gap", name: "Finger gap", desc: "How far above your finger the ship flies.", opts: [["small", "Small"], ["normal", "Normal"], ["large", "Large"]], demo: true },
    { k: "hand", name: "Thumb side", desc: "Nudges the ship sideways so your thumb never covers it.", opts: [["left", "Left hand"], ["center", "Center"], ["right", "Right hand"]], demo: true },
    { k: "haptics", name: "Vibration", desc: "Buzz on hits, cores and trophies (phones that support it).", opts: [[true, "On"], [false, "Off"]] },
    { k: "motion", name: "Calm effects", desc: "Less screen shake, softer flashes, no glitch slices. Auto follows your phone's reduce-motion setting.", opts: [["auto", "Auto"], ["on", "On"], ["off", "Off"]] },

  let settingsBack = null;
